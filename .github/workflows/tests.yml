name: tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Pint + PHPStan - Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { laravel: '12.*', testbench: '^10.0' }
          - { laravel: '13.*', testbench: '^11.0' }
    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: pdo_mysql, pdo_pgsql, pdo_sqlite
          coverage: none

      - name: Require Laravel ${{ matrix.laravel }}
        run: >
          composer require --dev --no-update --no-interaction
          "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}"

      - uses: ramsey/composer-install@v4
        with:
          dependency-versions: highest

      - run: composer cs
        if: matrix.laravel == '12.*'
      - run: composer phpstan -- --error-format=github

  tests:
    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }} - CRDB ${{ matrix.crdb }} - MO ${{ matrix.matrixone }} - PG 17 - MySQL 8.4
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.2', laravel: '12.*', testbench: '^10.0', crdb: v26.2.6, matrixone: 4.2.4 }
          - { php: '8.3', laravel: '12.*', testbench: '^10.0', crdb: v25.4.17, matrixone: 4.2.4 }
          - { php: '8.3', laravel: '13.*', testbench: '^11.0', crdb: v26.2.6, matrixone: 4.2.5 }
          - { php: '8.4', laravel: '13.*', testbench: '^11.0', crdb: v26.2.6, matrixone: 4.2.4 }

    env:
      DB_PORTABLE_REQUIRE_SERVERS: 1
      MATRIXONE_HOST: 127.0.0.1
      MATRIXONE_PORT: 6001
      CRDB_HOST: 127.0.0.1
      CRDB_PORT: 26258
      PGSQL_HOST: 127.0.0.1
      PGSQL_PORT: 5433
      PGSQL_USERNAME: postgres
      PGSQL_PASSWORD: secret
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3307
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: secret

    steps:
      - uses: actions/checkout@v6

      - name: Start CockroachDB, MatrixOne, PostgreSQL and MySQL
        run: |
          docker run -d --name crdb -p 127.0.0.1:26258:26257 \
            cockroachdb/cockroach:${{ matrix.crdb }} start-single-node --insecure --store=type=mem,size=1GiB
          docker run -d --name matrixone --hostname matrixone -p 127.0.0.1:6001:6001 \
            matrixorigin/matrixone:${{ matrix.matrixone }}
          docker run -d --name pgsql -p 127.0.0.1:5433:5432 -e POSTGRES_PASSWORD=secret postgres:17
          docker run -d --name mysql -p 127.0.0.1:3307:3306 -e MYSQL_ROOT_PASSWORD=secret mysql:8.4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, pdo_pgsql, pdo_sqlite, intl
          coverage: none

      - name: Require Laravel ${{ matrix.laravel }}
        run: >
          composer require --dev --no-update --no-interaction
          "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}"

      # composer update, so the lock file does not override the Laravel version above.
      - uses: ramsey/composer-install@v4
        with:
          dependency-versions: highest

      - name: Wait for the servers
        run: |
          for i in $(seq 1 90); do
            docker exec crdb ./cockroach sql --insecure -e 'select 1' >/dev/null 2>&1 \
              && mysql -h 127.0.0.1 -P 6001 -u root -p111 -e 'select 1' >/dev/null 2>&1 \
              && php -r 'new PDO("pgsql:host=127.0.0.1;port=5433;dbname=postgres", "postgres", "secret");' >/dev/null 2>&1 \
              && mysql -h 127.0.0.1 -P 3307 -u root -psecret -e 'select 1' >/dev/null 2>&1 \
              && exit 0
            sleep 2
          done
          for c in crdb matrixone pgsql mysql; do docker logs --tail 50 $c; done
          exit 1

      - run: vendor/bin/phpunit --colors=always

      - name: Server logs
        if: failure()
        run: |
          for c in crdb matrixone pgsql mysql; do docker logs --tail 200 $c; done
